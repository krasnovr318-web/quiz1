{% extends "base.html" %}

{% block title %}Редактировать викторину{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4" style="color: #4caf50;">✏️ Редактирование викторины</h2>

        <form method="POST" id="quizForm">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="mb-3" style="color: #4caf50;">Основные настройки</h5>

                    <div class="mb-3">
                        <label for="title" class="form-label">Название викторины</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ quiz.title }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="theme_color" class="form-label">Цвет фона</label>
                            <input type="color" class="form-control form-control-color" id="theme_color" name="theme_color" value="{{ quiz.theme_color }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="text_color" class="form-label">Цвет текста</label>
                            <input type="color" class="form-control form-control-color" id="text_color" name="text_color" value="{{ quiz.text_color }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="button_color" class="form-label">Цвет кнопки</label>
                            <input type="color" class="form-control form-control-color" id="button_color" name="button_color" value="{{ quiz.button_color }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="button_hover_color" class="form-label">Цвет кнопки при наведении</label>
                            <input type="color" class="form-control form-control-color" id="button_hover_color" name="button_hover_color" value="{{ quiz.button_hover_color }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="time_limit" class="form-label">Время на ответ (секунды)</label>
                            <input type="number" class="form-control" id="time_limit" name="time_limit" value="{{ quiz.time_limit }}" min="5" max="3600" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="form-check mt-4">
                                <input type="checkbox" class="form-check-input" id="timer_enabled" name="timer_enabled" value="true" {% if quiz.timer_enabled %}checked{% endif %}>
                                <label class="form-check-label" for="timer_enabled">
                                    ⏱️ Включить таймер
                                </label>
                                <div class="form-text">Если отключить, времени на ответ не будет</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="questionsContainer">
                <!-- Вопросы будут добавлены здесь -->
            </div>

            <input type="hidden" name="question_count" id="questionCount" value="0">

            <div class="mb-4">
                <button type="button" class="btn btn-success" onclick="addQuestion()">+ Добавить вопрос</button>
            </div>

            <div class="d-grid mb-5">
                <button type="submit" class="btn btn-primary btn-lg">💾 Сохранить изменения</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let questionCounter = 0;

function addQuestion(questionData = null) {
    const container = document.getElementById('questionsContainer');
    const questionDiv = document.createElement('div');
    questionDiv.className = 'card mb-4';
    questionDiv.id = `question_${questionCounter}`;

    let questionText = questionData ? questionData.text : '';
    let answers = questionData ? questionData.answers : ['', ''];
    let correctAnswer = questionData ? questionData.correct : 0;

    let answersHTML = '';
    answers.forEach((answer, index) => {
        answersHTML += `
            <div class="answer-group mb-2">
                <div class="input-group">
                    <input type="text" class="form-control" name="answer_${questionCounter}_${index}" value="${answer.replace(/"/g, '&quot;')}" placeholder="Ответ ${index + 1}" required>
                    <div class="input-group-text">
                        <input type="radio" name="correct_answer_${questionCounter}" value="${index}" ${index === correctAnswer ? 'checked' : ''} required> Правильный
                    </div>
                </div>
            </div>
        `;
    });

    questionDiv.innerHTML = `
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0" style="color: #4caf50;">Вопрос ${questionCounter + 1}</h5>
                <button type="button" class="btn btn-danger btn-sm" onclick="removeQuestion(${questionCounter})">
                    🗑️ Удалить
                </button>
            </div>

            <div class="mb-3">
                <label class="form-label">Текст вопроса</label>
                <input type="text" class="form-control" name="question_${questionCounter}" value="${questionText.replace(/"/g, '&quot;')}" required>
            </div>

            <div id="answers_${questionCounter}">
                ${answersHTML}
            </div>

            <input type="hidden" name="answer_count_${questionCounter}" id="answerCount_${questionCounter}" value="${answers.length}">

            <button type="button" class="btn btn-sm btn-secondary mt-2" onclick="addAnswer(${questionCounter})" id="addAnswerBtn_${questionCounter}">
                + Добавить ответ
            </button>
            <small class="text-muted ms-2">Максимум 10 ответов</small>
        </div>
    `;

    container.appendChild(questionDiv);
    questionCounter++;
    document.getElementById('questionCount').value = questionCounter;
}

function removeQuestion(index) {
    const question = document.getElementById(`question_${index}`);
    if (question) {
        question.remove();
        const remaining = document.querySelectorAll('[id^="question_"]');
        questionCounter = remaining.length;
        document.getElementById('questionCount').value = questionCounter;

        remaining.forEach((q, idx) => {
            const header = q.querySelector('h5');
            if (header) {
                header.textContent = `Вопрос ${idx + 1}`;
            }
        });
    }
}

function addAnswer(questionIndex) {
    const answerCount = parseInt(document.getElementById(`answerCount_${questionIndex}`).value);

    if (answerCount >= 10) {
        alert('Максимальное количество ответов: 10');
        return;
    }

    const answersDiv = document.getElementById(`answers_${questionIndex}`);
    const newAnswer = document.createElement('div');
    newAnswer.className = 'answer-group mb-2';
    newAnswer.innerHTML = `
        <div class="input-group">
            <input type="text" class="form-control" name="answer_${questionIndex}_${answerCount}" placeholder="Ответ ${answerCount + 1}" required>
            <div class="input-group-text">
                <input type="radio" name="correct_answer_${questionIndex}" value="${answerCount}" required> Правильный
            </div>
        </div>
    `;

    answersDiv.appendChild(newAnswer);
    document.getElementById(`answerCount_${questionIndex}`).value = answerCount + 1;

    if (answerCount + 1 >= 10) {
        document.getElementById(`addAnswerBtn_${questionIndex}`).style.display = 'none';
    }
}

// Загрузка существующих вопросов
{% if quiz.questions %}
    {% for question in quiz.questions %}
        addQuestion({
            text: "{{ question.question_text|replace('"', '\\"')|safe }}",
            answers: {{ question.answers|safe }},
            correct: {{ question.correct_answer }}
        });
    {% endfor %}
{% endif %}

// Если нет вопросов, добавляем один пустой
if (questionCounter === 0) {
    addQuestion();
}
</script>
{% endblock %}
