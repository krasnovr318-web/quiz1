{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card bg-secondary text-light">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Вход в систему</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary"
                               id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control bg-dark text-light border-secondary"
                               id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark">Войти</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('register') }}" class="text-light">Нет аккаунта? Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
